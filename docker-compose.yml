version: '3.9'

volumes:
  postgres-data:
  mongo-data:

networks:
  recipe-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_AUTH_URL=http://localhost:3002
      - VITE_AI_URL=http://localhost:8000
    networks:
      - recipe-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - '3002:3002'
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    environment:
      - PORT=3002
      - POSTGRES_URL=postgresql://recipe_user:recipe_pass@postgres:5432/recipe_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
    depends_on:
      - postgres
    networks:
      - recipe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - POSTGRES_URL=postgresql://recipe_user:recipe_pass@postgres:5432/recipe_db
      - MONGO_URL=mongodb://mongo:27017/recipe_ingredients
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3002
    depends_on:
      - postgres
      - mongo
    networks:
      - recipe-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./ai-service:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGO_URL=mongodb://mongo:27017/recipe_ingredients
    depends_on:
      - mongo
    networks:
      - recipe-network

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=recipe_user
      - POSTGRES_PASSWORD=recipe_pass
      - POSTGRES_DB=recipe_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - recipe-network

  mongo:
    image: mongo:7-jammy
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=recipe_ingredients
    volumes:
      - mongo-data:/data/db
    networks:
      - recipe-network