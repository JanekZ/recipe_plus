version: '3.9'

volumes:
  postgres-data:
  mongo-data:

networks:
  recipe-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=
      - VITE_AUTH_URL=
      - VITE_AI_URL=
    networks:
      - recipe-network
