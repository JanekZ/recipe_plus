version: '3.9'

volumes:
  postgres-data:
  mongo-data:

networks:
  recipe-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=
      - VITE_AUTH_URL=
      - VITE_AI_URL=
    networks:
      - recipe-network

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=recipe_user
      - POSTGRES_PASSWORD=recipe_pass
      - POSTGRES_DB=recipe_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - recipe-network

  mongo:
    image: mongo:7-jammy
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=recipe_ingredients
    volumes:
      - mongo-data:/data/db
    networks:
      - recipe-network